<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Home</title>
<style>
  :root { color-scheme: dark; background: #1e1e2e; color: #cdd6f4; font-family: ui-monospace, 'Cascadia Code', 'DejaVu Sans Mono', monospace; --muted: #9399b2; --accent: #89b4fa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 280px; min-height: 100svh; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100svh; padding: 28px 20px 60px; }
  .hero { width: min(520px, 76vw, max(160px, calc(100svh - 310px))); aspect-ratio: 1; flex: none; }
  .identity { margin: 15px 0 24px; font-size: 10px; letter-spacing: .24em; color: var(--muted); text-transform: uppercase; }
  .identity span { color: #7ebae4; }
  .launcher { width: min(620px, 100%); }
  form { position: relative; display: flex; align-items: center; min-height: 55px; border-bottom: 1px solid #45475a; transition: border-color 180ms; }
  form:focus-within { border-color: #7f849c; }
  .prompt { color: #89b4fa; font-size: 20px; margin-right: 15px; user-select: none; }
  input { color: #cdd6f4; min-width: 0; width: 100%; padding: 12px 0; background: transparent; border: 0; outline: none; font: inherit; font-size: 17px; caret-color: var(--accent); }
  input::placeholder { color: #9399b2; opacity: 1; font-size: 14px; }
  button, a { -webkit-tap-highlight-color: transparent; }
  .open { flex: none; border: 1px solid #585b70; border-radius: 5px; background: #262637; color: #cdd6f4; padding: 8px 12px; margin-left: 10px; cursor: pointer; font: inherit; font-size: 11px; }
  .open:hover { background: #313244; border-color: var(--accent); }
  .open[hidden] { display: none; }
  .open kbd { margin-left: 9px; color: var(--accent); }
  :focus-visible { outline: 2px solid #89b4fa; outline-offset: 5px; }
  input:focus-visible { outline: none; }
  .sites { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 29px; }
  .site { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 3px 18px; color: #a6adc8; text-decoration: none; border-radius: 8px; transition: color 180ms, opacity 180ms, background 180ms, transform 180ms; }
  .site svg, .site img { width: 25px; height: 25px; display: block; }
  .site img { filter: grayscale(1); opacity: .8; transition: filter 180ms; }
  .site-label { font-size: 10px; white-space: nowrap; }
  .site::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--brand); opacity: 0; transition: opacity 180ms; }
  .site:hover, .site:focus-visible, .site.selected { color: var(--brand); background: #242435; transform: translateY(-2px); }
  .site.selected::after { opacity: 1; }
  .site.selected img, .site:hover img, .site:focus-visible img { filter: none; opacity: 1; }
  .sites.filtering .site:not(.match) { opacity: .35; }
  .sites.filtering .site:hover, .sites.filtering .site:focus-visible { opacity: 1; }
  .status { min-height: 18px; margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 10px; }
  footer { position: absolute; bottom: 22px; text-align: center; color: #9399b2; font-size: 10px; }
  kbd { font: inherit; }
  footer span { margin: 0 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 480px) { .hero { width: min(520px, 76vw, max(140px, calc(100svh - 390px))); } .sites { grid-template-columns: repeat(3, 1fr); } main { padding-inline: 24px; } .sites { gap: 2px; margin-top: 23px; } .site-label { font-size: 9px; } .site svg, .site img { width: 22px; height: 22px; } .identity { margin-bottom: 16px; } footer span { margin: 0 5px; } }
  @media (max-height: 530px) and (min-width: 650px) { main { flex-direction: row; gap: 40px; padding-bottom: 50px; } .hero { width: min(38vw, 72svh); } .identity { position: absolute; top: 10px; left: 24px; } .launcher { width: min(480px, 48vw); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>

     Shape sampled into blocks; colors adapted. -->
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main>
  <div class="hero" aria-hidden="true"></div>
  <h1 class="sr-only">Home — website launcher</h1>
  <div class="identity" aria-hidden="true"><span>λ</span> &nbsp; <span id="identity">nix / home</span></div>
  <section class="launcher" aria-label="Website launcher">
    <form id="launch" role="search">
      <label class="sr-only" for="query">Find a website or search the web</label>
      <span class="prompt" aria-hidden="true">›</span>
      <input id="query" type="text" placeholder="Type to launch" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="status" autofocus>
      <button class="open" id="open" type="submit" hidden><span id="action">Open</span><kbd aria-hidden="true">↵</kbd></button>
    </form>
    <nav id="sites" class="sites" aria-label="Favorite websites"></nav>
    <p id="status" class="status" role="status" aria-live="polite">One match opens automatically.</p>
  </section>
  <footer><span><kbd>↑ ↓</kbd> choose</span><span><kbd>enter</kbd> open</span><span><kbd>esc</kbd> reset</span></footer>
</main>
